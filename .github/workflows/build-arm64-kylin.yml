name: Build ARM64 Kylin Binary (PyInstaller + Python 3.8)

# 触发：打 v* 标签推送，或手动触发
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 仅打 release 时需要写权限；纯 artifact 可去掉
permissions:
  contents: write

jobs:
  build-arm64-kylin:
    # x86 Runner 上通过 QEMU 模拟 ARM64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in ARM64 Ubuntu 20.04 (Python 3.8 + system PyQt5)
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            arm64v8/ubuntu:20.04 \
            /bin/bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              # 系统级 PyQt5 + PyInstaller（ARM64 编译版，无 pip wheel 可用）
              # Ubuntu 20.04 自带 Python 3.8，glibc 2.31，与麒麟 V10 对齐
              apt-get install -y --no-install-recommends \
                python3 python3-pip python3-dev \
                python3-pyqt5 \
                build-essential \
                libgl1 libegl1 libxkbcommon0 \
                libdbus-1-3 libx11-6 libxext6 libxrender1 libglib2.0-0
              echo "==> Python version:"
              python3 --version
              pip3 install --upgrade pip
              # 纯 Python 依赖（PyQt5 已通过 apt 安装）
              pip3 install -r requirements.txt
              # PyInstaller（PyPI 有 manylinux2014_aarch64 wheel，pip 直接安装无需编译）
              pip3 install pyinstaller
              # 验证依赖
              python3 -c "from PyQt5.QtWidgets import QApplication; import openpyxl; import xlrd; print(\"依赖OK\")"
              echo "==> PyInstaller version:"
              python3 -m PyInstaller --version
              # 用 spec 文件打包（含 collect_all PyQt5 + excludes，与本地 build.sh 一致）
              python3 -m PyInstaller wps_table_mapper.spec --clean --noconfirm
              echo "==> Done. Output:"
              ls -lh dist/
            '

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WPS表格字段映射工具-arm64-kylin
          path: dist/WPS表格字段映射工具
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WPS表格字段映射工具
